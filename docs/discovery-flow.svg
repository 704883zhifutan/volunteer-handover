<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="3380" viewBox="0 0 1040 3380" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif">
<defs><style>

      .t { fill:#1f2937; }
      .h1 { font-size:20px; font-weight:700; fill:#0f172a; }
      .h2 { font-size:12.5px; fill:#64748b; }
      .note { font-size:11.5px; fill:#475569; }
      .title { font-size:13.5px; font-weight:600; }
      .sub { font-size:11.5px; fill:#4b5563; }
      .dno { font-size:10.5px; fill:#a16207; font-weight:600; }
      .dtitle { font-size:13px; font-weight:600; fill:#713f12; }
      .dsub { font-size:11px; fill:#92400e; }
      .edge { font-size:11px; fill:#6b7280; }
      .chip { font-size:10px; font-weight:600; }
      .leg { font-size:11.5px; fill:#4b5563; }
      .card { font-size:12.5px; font-weight:600; fill:#111827; }
      .card2 { font-size:11px; fill:#6b7280; }
      .foot { font-size:11px; fill:#6b7280; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<text class="t h1" x="40" y="52">业务需求发现与验证 · 谁在判断，AI 在哪一步出手</text>
<text class="t h2" x="40" y="78">从六个人各说一段，到敢在真实班次上试一次：19 步 · 6 个人判断点 · 4 个签字节点</text>
<rect x="40" y="94" width="960" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text class="t note" x="56" y="116">范围：从“六个人各说一段”到“敢在真实班次上试一次”。AI 只做草稿和核对，签字一律是人。</text>
<rect x="190" y="150" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="182">01　业务目标与边界</text>
<text class="t sub" x="216" y="204">一句话目标；以及不可越的三条：只读、不外发、不自动指派</text>
<text class="t sub" x="216" y="223">谁定范围、谁有叫停权，一次讲清（f04 / f05）</text>
<rect x="564" y="162" width="84" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text class="t chip" x="606" y="176" text-anchor="middle" fill="#475569">人定</text>
<line x1="425" y1="246" x2="425" y2="279" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="190" y="288" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="320">02　选访谈对象：六个角色</text>
<text class="t sub" x="216" y="342">每人只知道自己那一段；单一角色的说法不成立</text>
<text class="t sub" x="216" y="361">跨角色交叉，才有“事实”而不是“观点”</text>
<rect x="564" y="300" width="84" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text class="t chip" x="606" y="314" text-anchor="middle" fill="#475569">人定</text>
<line x1="425" y1="384" x2="425" y2="417" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="190" y="426" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="458">03　逐条记录事实 f00–f55</text>
<text class="t sub" x="216" y="480">编号 + 原话 + 出处；先不做归纳，也不急着下结论</text>
<text class="t sub" x="216" y="499">记下“没被提到”的东西，往往比说出来的更关键</text>
<rect x="564" y="438" width="84" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
<text class="t chip" x="606" y="452" text-anchor="middle" fill="#047857">人记录</text>
<line x1="425" y1="522" x2="425" y2="555" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="190" y="564" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="596">04　AI：抽取候选问题</text>
<text class="t sub" x="216" y="618">把事实归到问题类别，标出互相矛盾的条目</text>
<text class="t sub" x="216" y="637">只生成候选，不判定真假；候选必须能回到 f 编号</text>
<rect x="564" y="576" width="84" height="20" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
<text class="t chip" x="606" y="590" text-anchor="middle" fill="#6d28d9">AI 起草</text>
<line x1="425" y1="660" x2="425" y2="693" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="425,702 635,754 425,806 215,754" fill="#fefce8" stroke="#f0d9a8" stroke-width="1.4"/>
<text class="t dno" x="425" y="724" text-anchor="middle">05</text>
<text class="t dtitle" x="425" y="752" text-anchor="middle">事实够不够撑一条需求</text>
<text class="t dsub" x="425" y="771" text-anchor="middle">一条结论至少三条事实</text>
<rect x="700" y="706" width="320" height="96" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.3"/>
<text class="t title" x="720" y="736" fill="#a16207">回去补证，不硬写</text>
<text class="t sub" x="720" y="757.0">缺证的需求写出来也验不掉</text>
<text class="t sub" x="720" y="773.5">补一轮访谈，好过 W3 才发现没基线</text>
<line x1="635" y1="754" x2="692" y2="754" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="667.5" y="747" text-anchor="middle">否</text>
<path d="M 720 802 L 680 802 L 680 612 L 666 612" fill="none" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#ard)"/>
<text class="t edge" x="700" y="824" fill="#94a3b8">补证后重来</text>
<line x1="425" y1="806" x2="425" y2="839" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="435" y="828">是</text>
<polygon points="425,848 635,900 425,952 215,900" fill="#fefce8" stroke="#f0d9a8" stroke-width="1.4"/>
<text class="t dno" x="425" y="870" text-anchor="middle">06</text>
<text class="t dtitle" x="425" y="898" text-anchor="middle">同一事实 ≥2 个角色</text>
<text class="t dsub" x="425" y="917" text-anchor="middle">交叉验证</text>
<rect x="700" y="852" width="320" height="96" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.3"/>
<text class="t title" x="720" y="882" fill="#a16207">降级为待验证假设</text>
<text class="t sub" x="720" y="903.0">不删：可能是真的，只是还没人佐证</text>
<text class="t sub" x="720" y="919.5">清单上标清“单角色”，复盘时优先验</text>
<line x1="635" y1="900" x2="692" y2="900" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="667.5" y="893" text-anchor="middle">否</text>
<line x1="425" y1="952" x2="425" y2="985" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="435" y="974">是</text>
<rect x="190" y="994" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="1026">07　AI：写可证伪的需求假设</text>
<text class="t sub" x="216" y="1048">格式固定：如果 X，则 Y；判定方法 + 分母 + 判定人</text>
<text class="t sub" x="216" y="1067">写不出判定方法的，一律退回重写</text>
<rect x="564" y="1006" width="84" height="20" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
<text class="t chip" x="606" y="1020" text-anchor="middle" fill="#6d28d9">AI 起草</text>
<line x1="425" y1="1090" x2="425" y2="1123" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="425,1132 635,1184 425,1236 215,1184" fill="#fefce8" stroke="#f0d9a8" stroke-width="1.4"/>
<text class="t dno" x="425" y="1154" text-anchor="middle">08</text>
<text class="t dtitle" x="425" y="1182" text-anchor="middle">有量化基线吗</text>
<text class="t dsub" x="425" y="1201" text-anchor="middle">当前值 / 分母 / 来源</text>
<rect x="700" y="1136" width="320" height="96" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.3"/>
<text class="t title" x="720" y="1166" fill="#a16207">先测基线，不报方案</text>
<text class="t sub" x="720" y="1187.0">没有基线，“效率提升 40%”就是编的</text>
<text class="t sub" x="720" y="1203.5">基线本身也要人认，不是系统算的</text>
<line x1="635" y1="1184" x2="692" y2="1184" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="667.5" y="1177" text-anchor="middle">否</text>
<line x1="425" y1="1236" x2="425" y2="1269" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="435" y="1258">是</text>
<rect x="190" y="1278" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="1310">09　AI：设计确定性校验</text>
<text class="t sub" x="216" y="1332">一条校验对应一种失败方式；只判定，不修复</text>
<text class="t sub" x="216" y="1351">每条结论必须带 文件#L行号，否则丢弃</text>
<rect x="564" y="1290" width="84" height="20" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
<text class="t chip" x="606" y="1304" text-anchor="middle" fill="#6d28d9">AI 起草</text>
<line x1="425" y1="1374" x2="425" y2="1407" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="425,1416 635,1468 425,1520 215,1468" fill="#fefce8" stroke="#f0d9a8" stroke-width="1.4"/>
<text class="t dno" x="425" y="1438" text-anchor="middle">10</text>
<text class="t dtitle" x="425" y="1466" text-anchor="middle">这条能被工具判定吗</text>
<text class="t dsub" x="425" y="1485" text-anchor="middle">还是人的判断</text>
<rect x="700" y="1420" width="320" height="96" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.3"/>
<text class="t title" x="720" y="1450" fill="#15803d">写成人判断，工具只给依据</text>
<text class="t sub" x="720" y="1471.0">“交接完成”归业务方（G3），代码不判</text>
<text class="t sub" x="720" y="1487.5">宁可少一个自动结论，不要多一个假结论</text>
<line x1="635" y1="1468" x2="692" y2="1468" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="667.5" y="1461" text-anchor="middle">否</text>
<line x1="425" y1="1520" x2="425" y2="1553" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="435" y="1542">是</text>
<rect x="190" y="1562" width="470" height="96" rx="12" fill="#f5f7ff" stroke="#a5b4fc" stroke-width="1.3"/>
<text class="t title" x="216" y="1594">11　业务负责人签范围</text>
<text class="t sub" x="216" y="1616">签的是“做什么、不做什么”，不是签收文档</text>
<text class="t sub" x="216" y="1635">范围外的需求一律记入下一批，不进本次试点</text>
<rect x="544" y="1574" width="104" height="20" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text class="t chip" x="596" y="1588" text-anchor="middle" fill="#4338ca">签字 · 顾明岚</text>
<line x1="425" y1="1658" x2="425" y2="1691" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="190" y="1700" width="470" height="96" rx="12" fill="#f5f7ff" stroke="#a5b4fc" stroke-width="1.3"/>
<text class="t title" x="216" y="1732">12　质量负责人签验收口径</text>
<text class="t sub" x="216" y="1754">金标怎么标、召回怎么算、误报率分母是谁</text>
<text class="t sub" x="216" y="1773">验收不可证伪，等于没有验收</text>
<rect x="544" y="1712" width="104" height="20" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text class="t chip" x="596" y="1726" text-anchor="middle" fill="#4338ca">签字 · 傅景</text>
<line x1="425" y1="1796" x2="425" y2="1829" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="190" y="1838" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="1870">13　桌面推演 W0</text>
<text class="t sub" x="216" y="1892">用小样本把假设走一遍，不碰真实业务数据</text>
<text class="t sub" x="216" y="1911">目的是暴露“我们以为对但其实不对”的地方</text>
<rect x="564" y="1850" width="84" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text class="t chip" x="606" y="1864" text-anchor="middle" fill="#475569">人做</text>
<line x1="425" y1="1934" x2="425" y2="1967" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="425,1976 635,2028 425,2080 215,2028" fill="#fefce8" stroke="#f0d9a8" stroke-width="1.4"/>
<text class="t dno" x="425" y="1998" text-anchor="middle">14</text>
<text class="t dtitle" x="425" y="2026" text-anchor="middle">假设能被证伪吗</text>
<text class="t dsub" x="425" y="2045" text-anchor="middle">反例必须存在</text>
<rect x="700" y="1980" width="320" height="96" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.3"/>
<text class="t title" x="720" y="2010" fill="#b91c1c">退回 07 改假设</text>
<text class="t sub" x="720" y="2031.0">证不掉的假设，试点也证明不了</text>
<text class="t sub" x="720" y="2047.5">最贵的错误是把“听起来对”当成“已验证”</text>
<line x1="635" y1="2028" x2="692" y2="2028" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="667.5" y="2021" text-anchor="middle">否</text>
<line x1="425" y1="2080" x2="425" y2="2113" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="435" y="2102">是</text>
<rect x="190" y="2122" width="470" height="96" rx="12" fill="#f5f7ff" stroke="#a5b4fc" stroke-width="1.3"/>
<text class="t title" x="216" y="2154">15　客户侧确认用途与口径</text>
<text class="t sub" x="216" y="2176">对外怎么说、什么算“已交接”，由客户侧确认</text>
<text class="t sub" x="216" y="2195">系统不自动对外承诺（f52）</text>
<rect x="544" y="2134" width="104" height="20" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text class="t chip" x="596" y="2148" text-anchor="middle" fill="#4338ca">签字 · 叶书</text>
<line x1="425" y1="2218" x2="425" y2="2251" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="190" y="2260" width="470" height="96" rx="12" fill="#f5f7ff" stroke="#a5b4fc" stroke-width="1.3"/>
<text class="t title" x="216" y="2292">16　试点放行签字</text>
<text class="t sub" x="216" y="2314">G1 能不能说“发现全部重叠” · G2 队列谁值守 · G3 完成定义</text>
<text class="t sub" x="216" y="2333">缺一签就不放行：退出码 3，不是警告</text>
<rect x="544" y="2272" width="104" height="20" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text class="t chip" x="596" y="2286" text-anchor="middle" fill="#4338ca">签字 · 三方</text>
<line x1="425" y1="2356" x2="425" y2="2389" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="190" y="2398" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="2430">17　现场试点 W2</text>
<text class="t sub" x="216" y="2452">只开三个环节：交接、签到、排班；其余保持人肉</text>
<text class="t sub" x="216" y="2471">清单只读，不写回任何系统</text>
<rect x="564" y="2410" width="84" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text class="t chip" x="606" y="2424" text-anchor="middle" fill="#475569">人做</text>
<line x1="425" y1="2494" x2="425" y2="2527" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="425,2536 635,2588 425,2640 215,2588" fill="#fefce8" stroke="#f0d9a8" stroke-width="1.4"/>
<text class="t dno" x="425" y="2558" text-anchor="middle">18</text>
<text class="t dtitle" x="425" y="2586" text-anchor="middle">证据够不够扩范围</text>
<text class="t dsub" x="425" y="2605" text-anchor="middle">扩 / 收 / 停</text>
<rect x="700" y="2540" width="320" height="96" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.3"/>
<text class="t title" x="720" y="2570" fill="#15803d">收窄或停，不硬撑</text>
<text class="t sub" x="720" y="2591.0">工时没降就是没降，不许换口径解释</text>
<text class="t sub" x="720" y="2607.5">停也是结论：比扩错了便宜</text>
<line x1="635" y1="2588" x2="692" y2="2588" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="667.5" y="2581" text-anchor="middle">否</text>
<line x1="425" y1="2640" x2="425" y2="2673" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="435" y="2662">是</text>
<rect x="190" y="2682" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="2714">19　复盘决策门 W4 + 重新报价</text>
<text class="t sub" x="216" y="2736">按实测工时、误报率、确认完整率重算价值</text>
<text class="t sub" x="216" y="2755">报价随范围走：加范围必须加钱，减范围退钱</text>
<rect x="564" y="2694" width="84" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text class="t chip" x="606" y="2708" text-anchor="middle" fill="#475569">人定</text>
<text class="t h1" x="40" y="2844" font-size="15">六位受访者在发现流程里的位置</text>
<rect x="40" y="2866" width="300" height="82" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text class="t card" x="58" y="2892">顾明岚<tspan font-weight="400" fill="#6b7280">　业务负责人</tspan></text>
<text class="t card2" x="58" y="2916">定范围、签生效、拍试点口径</text>
<text class="t card2" x="58" y="2934" fill="#9ca3af">f00 / f04</text>
<rect x="360" y="2866" width="300" height="82" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text class="t card" x="378" y="2892">林亦舟<tspan font-weight="400" fill="#6b7280">　赛事现场协调员</tspan></text>
<text class="t card2" x="378" y="2916">现场核对与异常证实、顶班调人</text>
