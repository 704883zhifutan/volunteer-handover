    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
<text class="t h1" x="40" y="52">赛事志愿者排班与交接 · 全流程与人工判断点</text>
<text class="t h2" x="40" y="78">从只读导出到试点放行：18 步 · 6 个人工判断点 · 4 个签字节点</text>
<rect x="40" y="94" width="960" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text class="t note" x="56" y="116">范围：导出 → 表头契约 → 校验 → 清单 → 复核签字 → 确认 → 指标 → 金标 → 门禁 → 放行。写回、外发、自动指派这三类能力在本流程里不存在。</text>
<rect x="190" y="150" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="182">01　数据导出（只读脱敏）</text>
<text class="t sub" x="216" y="204">三套工具各自导出结构化 CSV：排班、签到、交接</text>
<text class="t sub" x="216" y="223">没有写回通道，没有外发通道（f30 / f32）</text>
<line x1="425" y1="246" x2="425" y2="279" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="425,288 635,340 425,392 215,340" fill="#fefce8" stroke="#f0d9a8" stroke-width="1.4"/>
<text class="t dno" x="425" y="310" text-anchor="middle">02</text>
<text class="t dtitle" x="425" y="338" text-anchor="middle">表头契约是否齐全</text>
<text class="t dsub" x="425" y="357" text-anchor="middle">必需列缺一列即停</text>
<rect x="700" y="292" width="320" height="96" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.3"/>
<text class="t title" x="720" y="322" fill="#b91c1c">阻断：本次不出结论</text>
<text class="t sub" x="720" y="343.0">退出码 2，缺哪一列写清楚</text>
<text class="t sub" x="720" y="359.5">缺列造出的“缺项”比没有更危险</text>
<line x1="635" y1="340" x2="692" y2="340" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="667.5" y="333" text-anchor="middle">否</text>
<path d="M 720 388 L 680 388 L 680 198 L 666 198" fill="none" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#ard)"/>
<text class="t edge" x="700" y="410" fill="#94a3b8">补齐列后重跑</text>
<line x1="425" y1="392" x2="425" y2="425" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="435" y="414">是</text>
<rect x="190" y="434" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="466">03　只读加载与快照</text>
<text class="t sub" x="216" y="488">记 sha256、行数、读取时间、失败原因</text>
<text class="t sub" x="216" y="507">读不到就标 unavailable：不重试、不补值（f35）</text>
<line x1="425" y1="530" x2="425" y2="563" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="425,572 635,624 425,676 215,624" fill="#fefce8" stroke="#f0d9a8" stroke-width="1.4"/>
<text class="t dno" x="425" y="594" text-anchor="middle">04</text>
<text class="t dtitle" x="425" y="622" text-anchor="middle">文件是否都读得到</text>
<text class="t dsub" x="425" y="641" text-anchor="middle">读到 0 行 ≠ 没读到</text>
<rect x="700" y="576" width="320" height="96" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.3"/>
<text class="t title" x="720" y="606" fill="#a16207">跳过相关校验并明说</text>
<text class="t sub" x="720" y="627.0">“这不等于没有缺岗”——不许悄悄少一段</text>
<text class="t sub" x="720" y="643.5">其余校验照跑，C8 记一条读取失败</text>
<line x1="635" y1="624" x2="692" y2="624" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="667.5" y="617" text-anchor="middle">否</text>
<line x1="425" y1="676" x2="425" y2="709" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="435" y="698">是</text>
<rect x="190" y="718" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="750">05　九条确定性校验 C1–C9</text>
<text class="t sub" x="216" y="772">C1 缺岗 · C2 占位 · C3 双时间 · C4 版本 · C5 交接</text>
<text class="t sub" x="216" y="791">C6 三值 · C7 编号 · C8 失败标记 · C9 能力边界</text>
<line x1="425" y1="814" x2="425" y2="847" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="190" y="856" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="888">06　生成两件产物</text>
<text class="t sub" x="216" y="910">一页缺项清单 + 交接责任清单</text>
<text class="t sub" x="216" y="929">每条都带 文件#L行号，能一跳回原始行</text>
<line x1="425" y1="952" x2="425" y2="985" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="190" y="994" width="470" height="96" rx="12" fill="#f5f7ff" stroke="#a5b4fc" stroke-width="1.3"/>
<text class="t title" x="216" y="1026">07　当班人核对原始行</text>
<text class="t sub" x="216" y="1048">现场事实只有现场知道：点位、顶班、临时调人</text>
<text class="t sub" x="216" y="1067">工具只提示，不覆盖原值（f14 / f22）</text>
<rect x="564" y="1006" width="84" height="20" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text class="t chip" x="606" y="1020" text-anchor="middle" fill="#4338ca">签字 · L1</text>
<line x1="425" y1="1090" x2="425" y2="1123" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="425,1132 635,1184 425,1236 215,1184" fill="#fefce8" stroke="#f0d9a8" stroke-width="1.4"/>
<text class="t dno" x="425" y="1154" text-anchor="middle">08</text>
<text class="t dtitle" x="425" y="1182" text-anchor="middle">这条能不能判定</text>
<text class="t dsub" x="425" y="1201" text-anchor="middle">依据够不够</text>
<rect x="700" y="1136" width="320" height="96" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.3"/>
<text class="t title" x="720" y="1166" fill="#a16207">转人工队列，标未复核</text>
<text class="t sub" x="720" y="1187.0">不默认通过，也不替人补事实（f44）</text>
<text class="t sub" x="720" y="1203.5">队列无人值守 = 停止条件之一</text>
<line x1="635" y1="1184" x2="692" y2="1184" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="667.5" y="1177" text-anchor="middle">否</text>
<path d="M 720 1232 L 680 1232 L 680 1042 L 666 1042" fill="none" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#ard)"/>
<text class="t edge" x="700" y="1254" fill="#94a3b8">补到事实后重新核对</text>
<line x1="425" y1="1236" x2="425" y2="1269" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="435" y="1258">是</text>
<rect x="190" y="1278" width="470" height="96" rx="12" fill="#f5f7ff" stroke="#a5b4fc" stroke-width="1.3"/>
<text class="t title" x="216" y="1310">09　复核签字并回填</text>
<text class="t sub" x="216" y="1332">review.csv：结论 + 复核人 + 时间 + 备注</text>
<text class="t sub" x="216" y="1351">缺复核人或缺时间 → 这条不生效（f45）</text>
<rect x="564" y="1290" width="84" height="20" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text class="t chip" x="606" y="1304" text-anchor="middle" fill="#4338ca">签字 · 复核人</text>
<line x1="425" y1="1374" x2="425" y2="1407" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="425,1416 635,1468 425,1520 215,1468" fill="#fefce8" stroke="#f0d9a8" stroke-width="1.4"/>
<text class="t dno" x="425" y="1438" text-anchor="middle">10</text>
<text class="t dtitle" x="425" y="1466" text-anchor="middle">是否涉及“交接完成”</text>
<text class="t dsub" x="425" y="1485" text-anchor="middle">G3 未定义</text>
<rect x="700" y="1420" width="320" height="96" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.3"/>
<text class="t title" x="720" y="1450" fill="#a16207">只出信号，不出结论</text>
<text class="t sub" x="720" y="1471.0">未签收 / 接收人缺失 / 未结项无责任人</text>
<text class="t sub" x="720" y="1487.5">清单头部留白“完成定义待确认”</text>
<line x1="635" y1="1468" x2="692" y2="1468" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="667.5" y="1461" text-anchor="middle">是</text>
<line x1="425" y1="1520" x2="425" y2="1553" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="435" y="1542">否</text>
<rect x="190" y="1562" width="470" height="96" rx="12" fill="#f5f7ff" stroke="#a5b4fc" stroke-width="1.3"/>
<text class="t title" x="216" y="1594">11　业务负责人确认生效</text>
<text class="t sub" x="216" y="1616">顾明岚：范围与试点口径（f04）</text>
<text class="t sub" x="216" y="1635">叫停权在傅景：假状态、越界指派、确认被绕过</text>
<rect x="564" y="1574" width="84" height="20" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text class="t chip" x="606" y="1588" text-anchor="middle" fill="#4338ca">签字 · L2</text>
<line x1="425" y1="1658" x2="425" y2="1691" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="190" y="1700" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="1732">12　指标复算</text>
<text class="t sub" x="216" y="1754">误报率（分母=已复核）· 确认率 · 复核滞后</text>
<text class="t sub" x="216" y="1773">确认率不足 100% 时，比率只覆盖已复核部分</text>
<line x1="425" y1="1796" x2="425" y2="1829" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="425,1838 635,1890 425,1942 215,1890" fill="#fefce8" stroke="#f0d9a8" stroke-width="1.4"/>
<text class="t dno" x="425" y="1860" text-anchor="middle">13</text>
<text class="t dtitle" x="425" y="1888" text-anchor="middle">确认完整率是否 100%</text>
<text class="t dsub" x="425" y="1907" text-anchor="middle">试点硬门</text>
<rect x="700" y="1842" width="320" height="96" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.3"/>
<text class="t title" x="720" y="1872" fill="#b91c1c">不得进现场结论</text>
<text class="t sub" x="720" y="1893.0">未确认的条目在现场等于没人负责</text>
<text class="t sub" x="720" y="1909.5">宁可少发一条，不许没主就发</text>
<text class="t sub" x="720" y="1926.0">回路：回到 09 补齐复核</text>
<line x1="635" y1="1890" x2="692" y2="1890" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="667.5" y="1883" text-anchor="middle">否</text>
<line x1="425" y1="1942" x2="425" y2="1975" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="435" y="1964">是</text>
<rect x="190" y="1984" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="2016">14　金标回放（W3）</text>
<text class="t sub" x="216" y="2038">50 次调班，双人各标一遍，分歧由傅景裁</text>
<text class="t sub" x="216" y="2057">scripts/score.py 出召回率与 G1 判定</text>
<line x1="425" y1="2080" x2="425" y2="2113" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<polygon points="425,2122 635,2174 425,2226 215,2174" fill="#fefce8" stroke="#f0d9a8" stroke-width="1.4"/>
<text class="t dno" x="425" y="2144" text-anchor="middle">15</text>
<text class="t dtitle" x="425" y="2172" text-anchor="middle">召回 100% 且无未覆盖</text>
<text class="t dsub" x="425" y="2191" text-anchor="middle">G1 的唯一判据</text>
<rect x="700" y="2126" width="320" height="96" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.3"/>
<text class="t title" x="720" y="2156" fill="#b91c1c">G1 不能关</text>
<text class="t sub" x="720" y="2177.0">召回没有分母 = 无法证伪</text>
<text class="t sub" x="720" y="2193.5">退出码 3，属性是“还关不掉”</text>
<text class="t sub" x="720" y="2210.0">回路：回到 14 补标注再比</text>
<line x1="635" y1="2174" x2="692" y2="2174" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="667.5" y="2167" text-anchor="middle">否</text>
<line x1="425" y1="2226" x2="425" y2="2259" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<text class="t edge" x="435" y="2248">是</text>
<rect x="190" y="2268" width="470" height="96" rx="12" fill="#f5f7ff" stroke="#a5b4fc" stroke-width="1.3"/>
<text class="t title" x="216" y="2300">16　三门禁签字</text>
<text class="t sub" x="216" y="2322">G1 傅景+秦芮 · G2 傅景+唐映秋+林亦舟</text>
<text class="t sub" x="216" y="2341">G3 顾明岚+唐映秋，叶书确认客户侧</text>
<rect x="564" y="2280" width="84" height="20" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text class="t chip" x="606" y="2294" text-anchor="middle" fill="#4338ca">签字 · 三方</text>
<line x1="425" y1="2364" x2="425" y2="2397" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="190" y="2406" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="2438">17　试点放行（W2）</text>
<text class="t sub" x="216" y="2460">只开交接、签到、排班三个环节</text>
<text class="t sub" x="216" y="2479">其余保持人肉，不加流程</text>
<line x1="425" y1="2502" x2="425" y2="2535" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="190" y="2544" width="470" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3"/>
<text class="t title" x="216" y="2576">18　复盘决策门（W4）</text>
<text class="t sub" x="216" y="2598">扩范围 / 收窄 / 停止，按工时与误报率定</text>
<text class="t sub" x="216" y="2617">对外口径由叶书确认，系统不代发（f52）</text>
<text class="t h1" x="40" y="2706" font-size="15">六位参与者在流程里的位置</text>
<rect x="40" y="2728" width="300" height="82" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text class="t card" x="58" y="2754">顾明岚<tspan font-weight="400" fill="#6b7280">　业务负责人</tspan></text>
<text class="t card2" x="58" y="2778">定范围、确认生效、拍试点口径</text>
<text class="t card2" x="58" y="2796" fill="#9ca3af">（f02 / f04）</text>
<rect x="360" y="2728" width="300" height="82" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text class="t card" x="378" y="2754">林亦舟<tspan font-weight="400" fill="#6b7280">　赛事现场协调员</tspan></text>
<text class="t card2" x="378" y="2778">现场核对与异常证实，顶班调人</text>
<text class="t card2" x="378" y="2796" fill="#9ca3af">（f10–f14）</text>
<rect x="680" y="2728" width="300" height="82" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text class="t card" x="698" y="2754">唐映秋<tspan font-weight="400" fill="#6b7280">　项目流程协调员</tspan></text>
<text class="t card2" x="698" y="2778">回填复核、交接与资料责任</text>
<text class="t card2" x="698" y="2796" fill="#9ca3af">（f20 / f25）</text>
<rect x="40" y="2824" width="300" height="82" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text class="t card" x="58" y="2850">秦芮<tspan font-weight="400" fill="#6b7280">　数字化工程师</tspan></text>
<text class="t card2" x="58" y="2874">只读导出、快照与编号规则</text>
<text class="t card2" x="58" y="2892" fill="#9ca3af">（f30 / f31）</text>
<rect x="360" y="2824" width="300" height="82" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text class="t card" x="378" y="2850">傅景<tspan font-weight="400" fill="#6b7280">　审核与质量负责人</tspan></text>
<text class="t card2" x="378" y="2874">金标标注、门禁签字、叫停权</text>
<text class="t card2" x="378" y="2892" fill="#9ca3af">（f41 / f44）</text>
<rect x="680" y="2824" width="300" height="82" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text class="t card" x="698" y="2850">叶书<tspan font-weight="400" fill="#6b7280">　客户协同代表</tspan></text>
<text class="t card2" x="698" y="2874">对外口径确认，不自动承诺</text>
<text class="t card2" x="698" y="2892" fill="#9ca3af">（f50 / f52）</text>
<text class="t h1" x="40" y="2942" font-size="15">读图说明</text>
<text class="t leg" x="56" y="2968"><tspan font-weight="600" fill="#111827">实线</tspan>　顺序与交接方向；箭头指向下一步。</text>
<text class="t leg" x="56" y="2992"><tspan font-weight="600" fill="#111827">虚线</tspan>　补信息后返回——不是放行，是回到上一处再核一遍。</text>
<text class="t leg" x="56" y="3016"><tspan font-weight="600" fill="#111827">菱形</tspan>　人工判断点，不是系统自动校验；判定权在人，工具只给依据。</text>
<text class="t leg" x="56" y="3040"><tspan font-weight="600" fill="#111827">蓝色框</tspan>　需要签字的节点：复核人 / 业务负责人 / 三方门禁。</text>
<text class="t foot" x="40" y="3080">编号是流程步序，不是系统自动执行顺序：菱形处的判断权始终在人，工具只给依据。</text>
<text class="t foot" x="40" y="3099">签字节点的含义是“这个人对这一步负责”，不是走形式：缺签名时该条不生效（复核），或缺一签就整批不出包（门禁）。</text>
<text class="t foot" x="40" y="3118">证据编号对应访谈报告 f00–f55 与 docs/design.md 的 C1–C9、docs/gates.md 的 G1–G3。</text>
