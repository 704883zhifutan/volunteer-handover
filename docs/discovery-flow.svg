<text class="t h1" x="40" y="3080" font-size="15">读图说明</text>
<text class="t leg" x="56" y="3106"><tspan font-weight="600" fill="#111827">实线</tspan>　流程方向；箭头指向下一步。</text>
<text class="t leg" x="56" y="3130"><tspan font-weight="600" fill="#111827">虚线</tspan>　补信息后回到上一步——不是放行，是重做一遍。</text>
<text class="t leg" x="56" y="3154"><tspan font-weight="600" fill="#111827">菱形</tspan>　人的判断点：AI 给依据，判断权在人。</text>
<text class="t leg" x="56" y="3178"><tspan font-weight="600" fill="#111827">紫色标记</tspan>　AI 起草 / 设计：产出是草稿，必须有人签字才生效。</text>
<text class="t leg" x="56" y="3202"><tspan font-weight="600" fill="#111827">蓝框</tspan>　签字节点：这一步没有这个人，结论作废。</text>
<text class="t foot" x="40" y="3242">AI 的产出全是草稿：候选问题、假设、校验设计；判定与签字不在它的权限里。</text>
<text class="t foot" x="40" y="3261">每个菱形都允许“否”，且“否”有明确去处——回补证、降级、退假设、收窄范围，没有一条是硬着头皮往下走。</text>
<text class="t foot" x="40" y="3280">签字节点的含义是责任：字不在，结论不生效（复核）或整批不放行（门禁）。</text>
<text class="t foot" x="40" y="3299">证据编号对应访谈报告 f00–f55 与 docs/design.md、docs/gates.md；本图由 scripts/make_discovery_flow.py 生成。</text>
<text class="t foot" x="40" y="3318">报价与范围：发现阶段的结论决定试点范围，试点结果决定下一轮报价（见 QUOTATION.md）。</text>
