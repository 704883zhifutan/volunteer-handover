<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="志愿者班次交接的人肉流程与出错代价">
  <defs>
    <style>
      .card { fill:#ffffff; stroke:#e5e7eb; stroke-width:1; }
      .hd   { fill:#f8fafc; }
      .t    { font-family: ui-sans-serif, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .title { font-size:15px; font-weight:600; fill:#111827; }
      .sub   { font-size:11px; fill:#6b7280; }
      .th    { font-size:11px; font-weight:600; fill:#9ca3af; letter-spacing:.4px; }
      .name  { font-size:13px; font-weight:600; fill:#111827; }
      .freq  { font-size:10px; fill:#9ca3af; }
      .who   { font-size:11.5px; fill:#374151; }
      .cost  { font-size:11.5px; fill:#4b5563; }
      .tool  { font-size:11.5px; fill:#1d4ed8; }
      .off   { font-size:11.5px; fill:#6b7280; }
      .num   { font-size:10.5px; font-weight:600; fill:#4338ca; }
      .band  { fill:#f8fafc; stroke:#e5e7eb; stroke-width:1; }
      .bt    { font-size:11.5px; fill:#374151; }
      .bk    { font-weight:600; fill:#111827; }
    </style>
  </defs>

  <!-- 外框：像一个小窗口 -->
  <rect class="card" x="0.5" y="0.5" width="899" height="599" rx="16"/>
  <path class="hd" d="M0.5 16.5 A16 16 0 0 1 16.5 0.5 H883.5 A16 16 0 0 1 899.5 16.5 V56 H0.5 Z"/>
  <line x1="0.5" y1="56" x2="899.5" y2="56" stroke="#e5e7eb"/>
  <circle cx="26" cy="28" r="6" fill="#fca5a5"/>
  <circle cx="48" cy="28" r="6" fill="#fcd34d"/>
  <circle cx="70" cy="28" r="6" fill="#86efac"/>
  <text class="t title" x="92" y="33">志愿者班次交接 · 人肉流程拆开看</text>
  <rect x="740" y="16" width="140" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text class="t sub" x="810" y="32" text-anchor="middle" fill="#4338ca">只读 · 不写回 · 不发消息</text>

  <!-- 表头 -->
  <text class="t th" x="64"  y="86">环节（多久来一次）</text>
  <text class="t th" x="300" y="86">谁做</text>
  <text class="t th" x="430" y="86">错了会怎样</text>
  <text class="t th" x="690" y="86">代价</text>
  <text class="t th" x="756" y="86">工具介入</text>

  <!-- 行 1 -->
  <rect x="0.5" y="104" width="899" height="56" fill="#ffffff"/>
  <circle cx="40" cy="132" r="11" fill="#eef2ff"/><text class="t num" x="40" y="136" text-anchor="middle">1</text>
  <text class="t name" x="64" y="130">岗位需求与范围</text>
  <text class="t freq" x="64" y="146">每批次 1 次</text>
  <text class="t who"  x="300" y="136">顾明岚</text>
  <text class="t cost" x="430" y="128">范围错了整批白做；</text>
  <text class="t cost" x="430" y="143">医疗安保被误派</text>
  <rect x="690" y="121" width="46" height="22" rx="11" fill="#ffedd5" stroke="#fdba74"/>
  <text class="t" x="713" y="136" text-anchor="middle" font-size="11" fill="#c2410c">高</text>
  <text class="t off"  x="756" y="136">只校验范围，不决策</text>
  <line x1="0.5" y1="160" x2="899.5" y2="160" stroke="#f3f4f6"/>

  <!-- 行 2 -->
  <rect x="0.5" y="160" width="899" height="56" fill="#fcfcfd"/>
  <circle cx="40" cy="188" r="11" fill="#eef2ff"/><text class="t num" x="40" y="192" text-anchor="middle">2</text>
  <text class="t name" x="64" y="186">人员匹配与排班</text>
  <text class="t freq" x="64" y="202">每批次都有</text>
  <text class="t who"  x="300" y="192">唐映秋 + 林亦舟</text>
  <text class="t cost" x="430" y="184">同一替补排两个点位，</text>
  <text class="t cost" x="430" y="199">现场真的会没人</text>
  <rect x="690" y="177" width="46" height="22" rx="11" fill="#ffedd5" stroke="#fdba74"/>
  <text class="t" x="713" y="192" text-anchor="middle" font-size="11" fill="#c2410c">高</text>
  <text class="t tool" x="756" y="192">C2 占位冲突</text>
  <line x1="0.5" y1="216" x2="899.5" y2="216" stroke="#f3f4f6"/>

  <!-- 行 3 -->
  <rect x="0.5" y="216" width="899" height="56" fill="#ffffff"/>
  <circle cx="40" cy="244" r="11" fill="#eef2ff"/><text class="t num" x="40" y="248" text-anchor="middle">3</text>
  <text class="t name" x="64" y="242">班次确认与发布</text>
  <text class="t freq" x="64" y="258">每批次 2–4 版</text>
  <text class="t who"  x="300" y="248">唐映秋</text>
  <text class="t cost" x="430" y="248">旧版本盖掉已确认的新版</text>
  <rect x="690" y="233" width="46" height="22" rx="11" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="t" x="713" y="248" text-anchor="middle" font-size="11" fill="#a16207">中高</text>
  <text class="t tool" x="756" y="248">C4 版本有效期</text>
  <line x1="0.5" y1="272" x2="899.5" y2="272" stroke="#f3f4f6"/>

  <!-- 行 4 -->
  <rect x="0.5" y="272" width="899" height="56" fill="#fcfcfd"/>
  <circle cx="40" cy="300" r="11" fill="#eef2ff"/><text class="t num" x="40" y="304" text-anchor="middle">4</text>
  <text class="t name" x="64" y="298">现场签到与到岗</text>
  <text class="t freq" x="64" y="314">每班次</text>
  <text class="t who"  x="300" y="304">志愿者 / 当班人</text>
  <text class="t cost" x="430" y="296">缺岗不产生任何记录，</text>
  <text class="t cost" x="430" y="311">所以没人会发现</text>
  <rect x="690" y="289" width="46" height="22" rx="11" fill="#ffedd5" stroke="#fdba74"/>
  <text class="t" x="713" y="304" text-anchor="middle" font-size="11" fill="#c2410c">高</text>
  <text class="t tool" x="756" y="304">C1 交叉比对</text>
  <line x1="0.5" y1="328" x2="899.5" y2="328" stroke="#f3f4f6"/>

  <!-- 行 5 -->
  <rect x="0.5" y="328" width="899" height="56" fill="#ffffff"/>
  <circle cx="40" cy="356" r="11" fill="#fee2e2"/><text class="t num" x="40" y="360" text-anchor="middle" fill="#b91c1c">5</text>
  <text class="t name" x="64" y="354">现场交接</text>
  <text class="t freq" x="64" y="370">每班次交界</text>
  <text class="t who"  x="300" y="360">交班人 → 接班人</text>
  <text class="t cost" x="430" y="352">未结项丢了，</text>
  <text class="t cost" x="430" y="367">往往客户投诉才暴露</text>
  <rect x="690" y="345" width="46" height="22" rx="11" fill="#fee2e2" stroke="#fca5a5"/>
  <text class="t" x="713" y="360" text-anchor="middle" font-size="11" fill="#b91c1c">最高</text>
  <text class="t tool" x="756" y="360">C5 交接清单</text>
  <line x1="0.5" y1="384" x2="899.5" y2="384" stroke="#f3f4f6"/>

  <!-- 行 6 -->
  <rect x="0.5" y="384" width="899" height="56" fill="#fcfcfd"/>
  <circle cx="40" cy="412" r="11" fill="#eef2ff"/><text class="t num" x="40" y="416" text-anchor="middle">6</text>
  <text class="t name" x="64" y="410">异常补录（群消息）</text>
  <text class="t freq" x="64" y="426">每天数次</text>
  <text class="t who"  x="300" y="416">全员</text>
  <text class="t cost" x="430" y="416">回填时间被当成发生时间</text>
  <rect x="690" y="401" width="46" height="22" rx="11" fill="#fefce8" stroke="#fde68a"/>
  <text class="t" x="713" y="416" text-anchor="middle" font-size="11" fill="#854d0e">中</text>
  <text class="t tool" x="756" y="416">C3 双时间戳</text>
  <line x1="0.5" y1="440" x2="899.5" y2="440" stroke="#f3f4f6"/>

  <!-- 行 7 -->
  <rect x="0.5" y="440" width="899" height="56" fill="#ffffff"/>
  <circle cx="40" cy="468" r="11" fill="#fee2e2"/><text class="t num" x="40" y="472" text-anchor="middle" fill="#b91c1c">7</text>
  <text class="t name" x="64" y="466">客户协同与对外</text>
  <text class="t freq" x="64" y="482">按需</text>
  <text class="t who"  x="300" y="472">叶书</text>
  <text class="t cost" x="430" y="472">对外承诺了做不到的事</text>
  <rect x="690" y="457" width="46" height="22" rx="11" fill="#fee2e2" stroke="#fca5a5"/>
  <text class="t" x="713" y="472" text-anchor="middle" font-size="11" fill="#b91c1c">最高</text>
  <text class="t off"  x="756" y="472">不碰（硬禁止）</text>
  <line x1="0.5" y1="496" x2="899.5" y2="496" stroke="#e5e7eb"/>

  <!-- 底部：三档切改 -->
  <rect class="band" x="16" y="508" width="868" height="76" rx="10"/>
  <text class="t bt" x="32" y="530"><tspan class="bk" fill="#1d4ed8">A 确定性核对</tspan>　工具出结论，每条可回到原始行：C1 缺岗 · C2 占位 · C4 版本 · C5 交接</text>
  <text class="t bt" x="32" y="552"><tspan class="bk" fill="#a16207">B 人机配合</tspan>　工具只提示，当班人核对、负责人确认：C3 双时间 · C6 三值 · C7 编号</text>
  <text class="t bt" x="32" y="574"><tspan class="bk" fill="#6b7280">C 明确不碰</tspan>　指派替补 · 对外承诺 · 判定"交接完成" · 审批——代码里不存在这些能力</text>
  <text class="t sub" x="868" y="530" text-anchor="end">代价 = 后果 × 发现难度 × 频次</text>
  <text class="t sub" x="868" y="574" text-anchor="end">先切代价最高、数据已具备的 3 个环节</text>
</svg>
